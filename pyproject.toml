[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "google_air_quality_api"
# The version is set by GH action on release
version = "0.0.0"
description = "Python module to talk to Google Air Quality API."
readme = "README.md"
license = "MIT"
authors = [{ name = "Thomas Peter Protzner", email = "thomas.protzner@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.3,<4.0.0",
    "mashumaro>=3.12,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/Thomas55555/python-google-air-quality-api"
Repository = "https://github.com/Thomas55555/python-google-air-quality-api"
Documentation = "https://github.com/Thomas55555/python-google-air-quality-api"
Issues = "https://github.com/Thomas55555/python-google-air-quality-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/google_air_quality_api"]


[dependency-groups]
dev = [
    "aioresponses==0.7.9",
    "codespell==2.4.3",
    "covdefaults==2.3.0",
    "coverage[toml]==7.16.0",
    "prek==0.5.1",
    "pre-commit-hooks==6.0.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-aiohttp==1.1.1",
    "ruff==0.16.5",
    "syrupy==6.0.0",
    "time-machine==3.5.0",
    "ty==0.0.77",
    "yamllint==1.38.0",
]

[tool.pytest.ini_options]
addopts = "--cov=google_air_quality_api --cov-report=term-missing -vv"
asyncio_mode = "auto"

[tool.ruff]
fix = true
show-fixes = true
src = ["./src"]
target-version = "py311"
line-length = 88
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
ignore = [
  "ANN401", # Opinioated warning on disallowing dynamically typed expressions
  "CPY001", # Just annoying, not really useful
  "D203", # Conflicts with other rules
  "D213", # Conflicts with other rules
  "D417", # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "S101", # False positives in tests
  "E501", # Temporary for tests

  # Conflicts with the Ruff formatter
  "COM812",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"example.py" = ["T201", "T203"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.environment]
root = ["./src"]

[tool.ty.src]
include = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 50

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["google_air_quality_api"]
